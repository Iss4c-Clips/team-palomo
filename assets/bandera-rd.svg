<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Dominican Republic Flag (Proportions 3:2) -->
  <rect width="900" height="600" fill="#ffffff" />
  <!-- Top Left: Ultramarine Blue -->
  <rect x="0" y="0" width="410" height="260" fill="#002D62" />
  <!-- Top Right: Vermilion Red -->
  <rect x="490" y="0" width="410" height="260" fill="#CE1126" />
  <!-- Bottom Left: Vermilion Red -->
  <rect x="0" y="340" width="410" height="260" fill="#CE1126" />
  <!-- Bottom Right: Ultramarine Blue -->
  <rect x="490" y="340" width="410" height="260" fill="#002D62" />
  <!-- Central White Cross is formed by the 80px white gap and the base #ffffff -->
</svg>
