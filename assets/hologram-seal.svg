<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Prismatic Rainbow Holographic Gradient -->
    <linearGradient id="holoPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9AA2" />
      <stop offset="20%" stop-color="#FFB7B2" />
      <stop offset="40%" stop-color="#FFDAC1" />
      <stop offset="60%" stop-color="#E2F0CB" />
      <stop offset="80%" stop-color="#B5EAD7" />
      <stop offset="100%" stop-color="#C7CEEA" />
    </linearGradient>

    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="25%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cccccc" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b0b0b0" />
    </linearGradient>

    <filter id="metalSheen">
      <feSpecularLighting result="specOut" specularExponent="20" lighting-color="#ffffff">
        <fePointLight x="50" y="50" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- Outer Holographic Disc -->
  <circle cx="100" cy="100" r="94" fill="url(#silverRing)" stroke="#999" stroke-width="1.5" />
  <circle cx="100" cy="100" r="88" fill="url(#holoPrism)" opacity="0.85" />
  
  <!-- Holographic radial rays -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.6">
    <line x1="100" y1="12" x2="100" y2="188" />
    <line x1="12" y1="100" x2="188" y2="100" />
    <line x1="38" y1="38" x2="162" y2="162" />
    <line x1="38" y1="162" x2="162" y2="38" />
    <line x1="60" y1="20" x2="140" y2="180" />
    <line x1="140" y1="20" x2="60" y2="180" />
    <line x1="20" y1="60" x2="180" y2="140" />
    <line x1="20" y1="140" x2="180" y2="60" />
  </g>

  <!-- Concentric Rings with Security Starlets -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="#444" stroke-width="1.2" />

  <!-- Circular Hologram Text -->
  <path id="holoTextTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
  <path id="holoTextBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none" />

  <text font-family="'Arial Black', sans-serif" font-size="7.5" fill="#1E3A8A" letter-spacing="1.5" opacity="0.9">
    <textPath href="#holoTextTop" startOffset="50%" text-anchor="middle">★ JUNTA CENTRAL PALOMIL ★</textPath>
  </text>
  <text font-family="'Arial Black', sans-serif" font-size="7" fill="#991B1B" letter-spacing="1.5" opacity="0.9">
    <textPath href="#holoTextBottom" startOffset="50%" text-anchor="middle">★ REPÚBLICA DOMINICANA ★</textPath>
  </text>

  <!-- Central Emblem (Palomo / Shield Monogram) -->
  <circle cx="100" cy="100" r="42" fill="url(#silverRing)" stroke="#333" stroke-width="1.5" />
  
  <!-- Silhouette of a stylized proud pigeon/dove (Palomo) with laurel leaves -->
  <g transform="translate(100, 98) scale(0.65)">
    <!-- Shield base -->
    <path d="M -30 -30 L 30 -30 C 30 10 20 30 0 45 C -20 30 -30 10 -30 -30 Z" fill="#002D62" />
    <path d="M -26 -26 L 26 -26 C 26 8 18 26 0 39 C -18 26 -26 8 -26 -26 Z" fill="#CE1126" />
    <polygon points="-6,-24 6,-24 0,-14" fill="#FFDF00" />
    
    <!-- Stylized Palomo Bird Motif -->
    <path d="M -15,-6 Q -5,-22 10,-12 Q 22,-3 14,14 Q 4,22 -8,12 Q -16,4 -15,-6 Z" fill="#FFFFFF" />
    <!-- Eye & beak -->
    <circle cx="7" cy="-9" r="1.5" fill="#002D62" />
    <polygon points="14,-9 20,-7 14,-5" fill="#FFDF00" />
    <!-- Wing -->
    <path d="M -7,-2 Q 2,4 -2,12 Q -12,8 -7,-2 Z" fill="#D4AF37" />
  </g>

  <!-- Holographic overlay shine effect -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7" />
</svg>
